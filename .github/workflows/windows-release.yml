name: Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional semantic version (defaults to 0.1.<run number>)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.13.1"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/willard"
  SESSION_SECRET: "windows-release-test-session-secret"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        shell: pwsh
        run: |
          "path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT

      - name: Restore pnpm package cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore portable PostgreSQL
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}\postgresql
          key: postgresql-${{ runner.os }}-16.15-25e6fcdfb8caec38691bf461125e7564508760666f7b8e5dc6a5f0818f58f81e

      - name: Install PostgreSQL for the source launcher smoke test
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          $postgresRoot = Join-Path $env:RUNNER_TEMP "postgresql\pgsql"
          $postgresBin = Join-Path $postgresRoot "bin"
          if (-not (Test-Path (Join-Path $postgresBin "initdb.exe"))) {
            $archive = Join-Path $env:RUNNER_TEMP "postgresql-16.15.zip"
            $downloadUrl = "https://get.enterprisedb.com/postgresql/postgresql-16.15-1-windows-x64-binaries.zip"
            Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
            $expectedSha256 = "25e6fcdfb8caec38691bf461125e7564508760666f7b8e5dc6a5f0818f58f81e"
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedSha256) {
              throw "The portable PostgreSQL archive did not match the pinned SHA-256."
            }
            Expand-Archive -Path $archive -DestinationPath (Join-Path $env:RUNNER_TEMP "postgresql") -Force
          }
          if (-not (Test-Path (Join-Path $postgresBin "initdb.exe"))) {
            throw "Portable PostgreSQL command-line tools were not found at $postgresBin."
          }
          $postgresBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PGPASSWORD=postgres" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:PGPASSWORD = "postgres"
          $dataRoot = Join-Path $env:RUNNER_TEMP "postgresql-data"
          $passwordFile = Join-Path $env:RUNNER_TEMP "postgresql-password.txt"
          Set-Content -Path $passwordFile -Value "postgres" -Encoding ASCII
          & (Join-Path $postgresBin "initdb.exe") --username=postgres --pwfile=$passwordFile --encoding=UTF8 --pgdata=$dataRoot
          if ($LASTEXITCODE -ne 0) { throw "Portable PostgreSQL initdb failed." }
          Remove-Item $passwordFile -Force
          $serverLog = Join-Path $env:RUNNER_TEMP "postgresql-server.log"
          & (Join-Path $postgresBin "pg_ctl.exe") -D $dataRoot -l $serverLog -o "-h 127.0.0.1 -p 5432" start
          if ($LASTEXITCODE -ne 0) { throw "Portable PostgreSQL failed to start. See $serverLog." }
          $ready = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            & (Join-Path $postgresBin "pg_isready.exe") -h 127.0.0.1 -p 5432 -U postgres
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw "Portable PostgreSQL did not become ready. See $serverLog." }
          & (Join-Path $postgresBin "createdb.exe") -h 127.0.0.1 -U postgres willard
          if ($LASTEXITCODE -ne 0) { throw "Could not create the release-test database." }

      - name: Gate release on type checks and generated API contracts
        run: |
          pnpm run check:artifacts
          if ($LASTEXITCODE -ne 0) { throw "Artifact source checks failed." }
          pnpm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "Type checks failed." }
          pnpm run check:router
          if ($LASTEXITCODE -ne 0) { throw "Router checks failed." }
          pnpm run check:api-contracts
          if ($LASTEXITCODE -ne 0) { throw "Generated API contract checks failed." }

      - name: Gate release on unit and packaging contracts
        run: |
          pnpm run test:database-backup
          if ($LASTEXITCODE -ne 0) { throw "Database backup tests failed." }
          pnpm run test:release-contracts
          if ($LASTEXITCODE -ne 0) { throw "Release contract tests failed." }

      - name: Install media fixture tools for backend audit
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw "ffmpeg is required by the Windows optimize-cycle audit fixture."
          }
          if (-not (Get-Command zip -ErrorAction SilentlyContinue)) {
            choco install zip --no-progress --yes
          }
          if (-not (Get-Command zip -ErrorAction SilentlyContinue)) {
            throw "zip is required by the Windows archive safety audit fixtures."
          }

      - name: Bootstrap disposable backend-audit database schema
        shell: pwsh
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/willard"
          PGPASSWORD: "postgres"
        run: |
          $ErrorActionPreference = "Stop"
          & node (Join-Path $env:GITHUB_WORKSPACE "setup-db.cjs")
          if ($LASTEXITCODE -ne 0) { throw "Could not bootstrap the disposable backend-audit database." }

      - name: Seed disposable backend-audit settings
        shell: pwsh
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/willard"
          WILLARD_NAS_PATH: "${{ github.workspace }}\\test-media"
        run: |
          $ErrorActionPreference = "Stop"
          & node -e '(async () => { const fs = require("fs"); const path = require("path"); const pgEntry = fs.readdirSync(path.join(process.cwd(), "node_modules", ".pnpm")).find((name) => /^pg@\d/.test(name)); if (!pgEntry) throw new Error("pg package not found in pnpm virtual store"); const { Pool } = require(path.join(process.cwd(), "node_modules", ".pnpm", pgEntry, "node_modules", "pg")); const bcrypt = require(path.join(process.cwd(), "artifacts", "api-server", "node_modules", "bcryptjs")); const pool = new Pool({ connectionString: process.env.DATABASE_URL }); try { const passwordHash = bcrypt.hashSync("willard123", 12); await pool.query("DELETE FROM app_settings"); await pool.query("INSERT INTO app_settings (nas_path, password_hash) VALUES ($1, $2)", [process.env.WILLARD_NAS_PATH, passwordHash]); } finally { await pool.end(); } })().catch((error) => { console.error(error); process.exit(1); });'
          if ($LASTEXITCODE -ne 0) { throw "Could not seed the disposable backend-audit settings." }

      - name: Run API server backend audit and backend integration tests
        shell: pwsh
        timeout-minutes: 30
        env:
          PORT: "8080"
          NODE_ENV: development
          WILLARD_API_URL: "http://127.0.0.1:8080"
          WILLARD_NAS_PATH: "${{ github.workspace }}\\test-media"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/willard"
          PGPASSWORD: "postgres"
          WILLARD_AUDIT_TEST_TIMEOUT_MS: "300000"
          WILLARD_AUDIT_HEARTBEAT_MS: "30000"
        run: |
          $ErrorActionPreference = "Stop"
          $apiLog = Join-Path $env:RUNNER_TEMP "willard-backend-audit-api.log"
          $apiErrorLog = Join-Path $env:RUNNER_TEMP "willard-backend-audit-api.err.log"
          $auditLog = Join-Path $env:RUNNER_TEMP "willard-backend-audit.log"
          $apiProcess = $null
          try {
            & pnpm --filter @workspace/api-server run build
            if ($LASTEXITCODE -ne 0) { throw "Could not build the API server for the backend audit." }
            $nodePath = (Get-Command node.exe).Source
            $apiEntry = Join-Path $env:GITHUB_WORKSPACE "artifacts\api-server\dist\index.mjs"
            $apiProcess = Start-Process $nodePath `
              -ArgumentList @("--enable-source-maps", $apiEntry) `
              -Environment @{
                WILLARD_LOCAL_DATA_ROOT = $env:RUNNER_TEMP
                WILLARD_LOCAL_CAPACITY_FLOOR_BYTES = "0"
                WILLARD_NAS_SAFETY_MARGIN_BYTES = "0"
              } `
              -WorkingDirectory (Join-Path $env:GITHUB_WORKSPACE "artifacts\api-server") `
              -RedirectStandardOutput $apiLog -RedirectStandardError $apiErrorLog -PassThru
            $ready = $false
            $deadline = (Get-Date).AddSeconds(180)
            while ((Get-Date) -lt $deadline) {
              try {
                $response = Invoke-WebRequest -Uri "$env:WILLARD_API_URL/api/healthz" -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match '"status"\s*:\s*"ok"') {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $ready) {
              $tail = if (Test-Path $apiLog) { Get-Content $apiLog -Tail 80 | Out-String } else { "" }
              $errorTail = if (Test-Path $apiErrorLog) { Get-Content $apiErrorLog -Tail 80 | Out-String } else { "" }
              throw "Backend audit API did not become ready.`n$tail`n$errorTail"
            }

            $ErrorActionPreference = "Continue"
            $PSNativeCommandUseErrorActionPreference = $false
            & pnpm run audit:backend *> $auditLog
            $auditExitCode = $LASTEXITCODE
            Get-Content $auditLog
            if ($auditExitCode -ne 0) {
              $rawTail = Get-Content $auditLog -Tail 80 | Out-String
              $apiTail = if (Test-Path $apiLog) { Get-Content $apiLog -Tail 80 | Out-String } else { "(API stdout log was not created)" }
              $apiErrorTail = if (Test-Path $apiErrorLog) { Get-Content $apiErrorLog -Tail 80 | Out-String } else { "(API stderr log was not created)" }
              @(
                "## Windows backend audit failure"
                ""
                "````text"
                $rawTail
                "````"
                ""
                "### API stdout"
                ""
                "````text"
                $apiTail
                "````"
                ""
                "### API stderr"
                ""
                "````text"
                $apiErrorTail
                "````"
              ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              throw "API server backend audit failed with exit code $auditExitCode."
            }
          } finally {
            if ($apiProcess -and -not $apiProcess.HasExited) {
              $null = & taskkill /PID $apiProcess.Id /T /F 2>&1
              }
          }

      - name: Upload backend audit log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-backend-audit-log
          path: |
            ${{ runner.temp }}/willard-backend-audit.log
            ${{ runner.temp }}/willard-backend-audit-api.log
            ${{ runner.temp }}/willard-backend-audit-api.err.log
          if-no-files-found: ignore

      - name: Install Chromium for browser release tests
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Ensure Chromium is installed
        run: pnpm exec playwright install chromium

      - name: Gate release on browser E2E suites
        env:
          WILLARD_START_LOCAL_SERVERS: "true"
        run: >-
          pnpm exec playwright test
          e2e/loading-error-states.spec.ts
          e2e/origin-boundary.spec.ts
          e2e/dashboard-attention-center.spec.ts
          e2e/search.spec.ts
          --workers=1

      - name: Gate release on storage-policy conformance
        run: pnpm run test:storage-conformance

      - name: Verify source launcher startup and failure diagnostics
        shell: pwsh
        run: .\scripts\windows\startup-smoke.ps1

      - name: Verify developer one-click updater on Windows
        shell: pwsh
        run: .\scripts\windows\update-smoke.ps1

      - name: Restore the bundled Windows Node runtime
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build\node-runtime
          key: node-runtime-${{ runner.os }}-${{ env.NODE_VERSION }}-fba577c4bb87df04d54dd87bbdaa5a2272f1f99a2acbf9152e1a91b8b5f0b279

      - name: Download or verify the bundled Windows Node runtime
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE "build\node-runtime"
          $zip = Join-Path $env:RUNNER_TEMP "node-runtime.zip"
          $expectedSha256 = "fba577c4bb87df04d54dd87bbdaa5a2272f1f99a2acbf9152e1a91b8b5f0b279"
          $expectedNodeExeSha256 = "e3be0545990c90995d7bf3a7af5d64af1f2e0fc1bbd9b79c27f7abc1e9676e50"
          $nodeExe = Join-Path $runtimeRoot "node.exe"
          if (-not (Test-Path $nodeExe)) {
            $url = "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
            if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedSha256) {
              throw "The downloaded Node.js runtime did not match the pinned SHA-256."
            }
            Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP\node-runtime -Force
            New-Item -ItemType Directory -Force -Path $runtimeRoot | Out-Null
            Copy-Item "$env:RUNNER_TEMP\node-runtime\node-v$env:NODE_VERSION-win-x64\*" $runtimeRoot -Recurse -Force
          }
          if ((Get-FileHash (Join-Path $runtimeRoot "node.exe") -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedNodeExeSha256) {
            throw "The extracted Node.js runtime executable did not match the pinned SHA-256."
          }
          Set-Content (Join-Path $runtimeRoot "node-runtime.sha256") $expectedSha256 -Encoding ASCII
          if (-not (Test-Path (Join-Path $runtimeRoot "node.exe"))) {
            throw "The bundled Windows Node runtime did not contain node.exe."
          }
          "WILLARD_NODE_RUNTIME=$runtimeRoot" >> $env:GITHUB_ENV

      - name: Choose release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "0.1.${{ github.run_number }}" }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[\w.-]+)?$') {
            throw "Release version must use MAJOR.MINOR.PATCH format."
          }
          "WILLARD_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Reject an existing release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $existingTag = @(& git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG" 2>$null)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify whether release tag $env:RELEASE_TAG already exists."
          }
          if ($existingTag.Count -gt 0) {
            throw "Release tag $env:RELEASE_TAG already exists. Supply a new version for a manual run."
          }

      - name: Create, validate, and package the release (payload validation and dependency audit gate)
        shell: pwsh
        env:
          PORT: "5000"
          BASE_PATH: "/"
          WILLARD_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.WILLARD_RELEASE_SIGNING_PRIVATE_KEY }}
          WILLARD_ARTIFACT_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}
        run: .\scripts\windows\make-release.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile the Windows installer
        shell: pwsh
        env:
          WILLARD_REQUIRE_WINDOWS_SIGNING: "true"
          WILLARD_WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WILLARD_WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WILLARD_WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WILLARD_WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: .\scripts\windows\compile-installer.ps1

      - name: Verify installed Windows lifecycle with external PostgreSQL
        shell: pwsh
        env:
          PGPASSWORD: "postgres"
          WILLARD_REQUIRE_WINDOWS_SIGNING: "true"
          WILLARD_WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WILLARD_WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WILLARD_WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WILLARD_WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: .\scripts\windows\installer-lifecycle-smoke.ps1

      - name: Publish installer, update ZIP, and manifest
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Willard Media Center ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            build/installer/WillardMediaCenter-${{ steps.version.outputs.version }}-Setup.exe
            build/release/WillardMediaCenter-${{ steps.version.outputs.version }}-windows-x64.zip
            build/release/WillardMediaCenter-${{ steps.version.outputs.version }}-source.zip
            build/release/release-manifest.json
