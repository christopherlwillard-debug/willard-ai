name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional semantic version (defaults to 0.1.<run number>)"
        required: false
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: "24.13.1"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL for the source launcher smoke test
        shell: pwsh
        run: |
          choco install postgresql16 --params="/Password:postgres" --no-progress --yes
          $service = Get-Service | Where-Object { $_.Name -like "postgresql*" } | Select-Object -First 1
          if (-not $service) { throw "PostgreSQL service was not installed." }
          Start-Service $service.Name
          $env:PGPASSWORD = "postgres"
          & "$env:ProgramFiles\PostgreSQL\16\bin\psql.exe" -h localhost -U postgres -c "ALTER USER postgres PASSWORD 'postgres';"
          & "$env:ProgramFiles\PostgreSQL\16\bin\createdb.exe" -h localhost -U postgres willard

      - name: Verify source launcher startup and failure diagnostics
        shell: pwsh
        run: .\scripts\windows\startup-smoke.ps1

      - name: Download the bundled Windows Node runtime
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:GITHUB_WORKSPACE "build\node-runtime"
          $zip = Join-Path $env:RUNNER_TEMP "node-runtime.zip"
          $url = "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP\node-runtime -Force
          New-Item -ItemType Directory -Force -Path $runtimeRoot | Out-Null
          Copy-Item "$env:RUNNER_TEMP\node-runtime\node-v$env:NODE_VERSION-win-x64\*" $runtimeRoot -Recurse -Force
          if (-not (Test-Path (Join-Path $runtimeRoot "node.exe"))) {
            throw "The bundled Windows Node runtime did not contain node.exe."
          }
          "WILLARD_NODE_RUNTIME=$runtimeRoot" >> $env:GITHUB_ENV

      - name: Choose release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "0.1.${{ github.run_number }}" }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[\w.-]+)?$') {
            throw "Release version must use MAJOR.MINOR.PATCH format."
          }
          "WILLARD_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Stage and validate the packaged payload
        shell: pwsh
        env:
          PORT: "5000"
          BASE_PATH: "/"
        run: |
          node scripts/windows/build-release.mjs
          node scripts/windows/validate-release.mjs

      - name: Create update ZIP and release manifest
        shell: pwsh
        env:
          WILLARD_ARTIFACT_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}
        run: .\scripts\windows\make-release.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile the Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$env:WILLARD_VERSION" `
            "installer\WillardMediaCenter.iss"
          $setup = "build\installer\WillardMediaCenter-$env:WILLARD_VERSION-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Inno Setup did not produce $setup." }

      - name: Publish installer, update ZIP, and manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Willard Media Center ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            build/installer/WillardMediaCenter-${{ steps.version.outputs.version }}-Setup.exe
            build/release/WillardMediaCenter-${{ steps.version.outputs.version }}-windows-x64.zip
            build/release/release-manifest.json
