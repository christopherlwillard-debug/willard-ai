name: Windows updater audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "desktop/WillardMediaCenter.ps1"
      - "scripts/windows/**"
      - "scripts/launcher/**"
      - ".github/workflows/windows-updater-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-updater-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  updater-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify packaged updater journal writes
        shell: pwsh
        run: .\scripts\windows\update-journal-smoke.ps1

      - name: Verify developer updater preservation and rollback
        shell: pwsh
        run: .\scripts\windows\update-smoke.ps1
