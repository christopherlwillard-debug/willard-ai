name: Audit dependency refresh

on:
  push:
    branches:
      - audit/full-repository-review-2026-11
    paths:
      - "pnpm-workspace.yaml"
      - "**/package.json"
      - ".github/workflows/dependency-refresh.yml"

permissions:
  contents: write

concurrency:
  group: audit-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    if: github.repository == 'christopherlwillard-debug/willard-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: audit/full-repository-review-2026-11

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.1"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Regenerate and publish the lockfile from the latest audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=0
          for attempt in 1 2 3; do
            git fetch origin audit/full-repository-review-2026-11
            git reset --hard FETCH_HEAD
            pnpm install --lockfile-only --no-frozen-lockfile
            if git diff --quiet -- pnpm-lock.yaml; then
              echo "The lockfile is already current."
              published=1
              break
            fi
            git add pnpm-lock.yaml
            git commit -m "chore(deps): refresh audited dependency lockfile"
            if git push origin HEAD:refs/heads/audit/full-repository-review-2026-11; then
              published=1
              break
            fi
            echo "Branch advanced during lockfile publication; retrying from latest branch (attempt $attempt)."
          done
          if [ "$published" -ne 1 ]; then
            echo "Unable to publish a current lockfile after three attempts."
            exit 1
          fi

      - name: Install the frozen, regenerated dependency graph
        run: pnpm install --frozen-lockfile

      - name: Typecheck the workspace
        run: pnpm run typecheck

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
